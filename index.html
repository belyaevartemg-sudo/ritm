<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFDF8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236E1F30'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%23FBF3EF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 2.5V11.5C8 14.6 10 16.4 12 17.6C14 16.4 16 14.6 16 11.5V2.5'/%3E%3Cpath d='M12 17.6V22'/%3E%3C/g%3E%3C/svg%3E">
<title>Камертон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Prata&display=swap">
<style>
/* Камертон v2: пудра, какао, эспрессо, персик; Prata + Manrope (brand/kamerton-brand-guide.md, разделы 7–9, по PDF Артёма) */
:root{
  --paper:#FBF3EF; --ink:#6E4B38; --muted:#8A6450; --hair:#D4AE9F; --tint:#F7E8E1; --surface:#EBCFC6;
  --accent:#6E4B38; --accent-ink:#FBF3EF; --accent-tint:#F7E8E1; --espresso:#3B2A22; --peach:#E3B99C;
  --ava-bg:#D4AE9F; --ava-ink:#6E4B38; --arc:#D4AE9F;
  --ok:#6E4B38; --ok-soft:#F7E8E1; --warn:#A9755A; --shade:rgba(59,42,34,.5); --line:var(--hair);
  --f-display:"Prata",Georgia,"Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:4px;
}
:root[data-ritm="dark"]{
  --paper:#3B2A22; --ink:#FBF3EF; --muted:#D4AE9F; --hair:#6E4B38; --tint:#5A4336; --surface:#4A372D;
  --accent:#E3B99C; --accent-ink:#3B2A22; --accent-tint:#5A4336;
  --ava-bg:#6E4B38; --ava-ink:#E3B99C; --arc:#6E4B38;
  --ok:#E3B99C; --ok-soft:#5A4336; --warn:#E3B99C; --shade:rgba(20,13,10,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.9rem;text-transform:uppercase;letter-spacing:.02em}
h2{font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;font-family:var(--f-body);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:24px;min-height:62px;flex-wrap:wrap;padding-block:6px}
.logo{font-family:var(--f-display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.12em;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.logo i{display:none}
.logo small{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.04em;color:var(--muted);text-transform:none}
.nav{display:flex;gap:20px;flex-wrap:wrap;flex:1}
.nav button{white-space:nowrap;border:0;background:none;padding:6px 0;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.nav .count{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);margin-left:4px;vertical-align:super}
.themebtn{border:1px solid var(--hair);background:none;height:33px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.themebtn:hover{border-color:var(--ink)}
.themebtn i{width:12px;height:12px;border-radius:50%;border:1px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.role{display:flex;border:1px solid var(--ink)}
.role button{border:0;background:none;padding:7px 14px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink)}
.role button.on{background:var(--ink);color:var(--paper)}

main{padding-block:28px 72px}

/* кнопки, метки */
.btn{border:1px solid var(--ink);background:var(--paper);padding:9px 18px;font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1);background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:0;text-decoration:underline;text-underline-offset:3px}
.btn.ghost:hover{background:none;color:var(--accent)}
.btn.sm{padding:6px 12px;font-size:.72rem}
.chip{border:0;border-bottom:1px solid transparent;background:none;padding:4px 0;font-size:.95rem;white-space:nowrap;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--ink);border-bottom-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tag::before{content:"";width:6px;height:6px;background:currentColor}
.tag.ok{color:var(--ok)}
.tag.acc{color:var(--accent)}
.tag.warn{color:var(--warn)}
.panel{background:var(--paper);border-top:1px solid var(--ink)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 0;font-weight:400;font-size:.98rem;letter-spacing:0;text-transform:none;color:var(--ink);min-width:0}
.field select{cursor:pointer}
.field option{background:var(--paper)}
textarea{resize:vertical}

/* вступление */
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--ink);margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin:0 0 14px}
.intro h1{font-size:clamp(1.9rem,4.6vw,3.6rem);line-height:1.02}
.intro h1 em{font-style:normal;color:var(--accent)}
.intro p.lead{margin:16px 0 0;max-width:52ch;color:var(--muted)}
.how{list-style:none;margin:0;padding:0;counter-reset:s;font-size:.9rem}
.how li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;padding:10px 0;border-top:1px solid var(--hair)}
.how li::before{content:"0" counter(s);font-family:var(--f-mono);font-size:.75rem;color:var(--accent);padding-top:2px}

.filters{display:grid;gap:18px;margin-bottom:26px}
.cats{display:flex;gap:22px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.frow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:20px;align-items:end}
.check{display:flex;gap:8px;align-items:center;font-size:.85rem;padding-bottom:9px;white-space:nowrap}
.check input{accent-color:var(--accent);width:16px;height:16px}
.resinfo{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}

/* каталог — лукбук */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:36px 24px}
.card{background:none;border:0;display:flex;flex-direction:column;text-align:left;padding:0;color:var(--ink)}
.card .pics{display:grid;grid-template-columns:3fr 2fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:4/3.4;max-width:100%}
.card .pics .art:first-child{grid-row:span 2}
.card .art{transition:filter .25s}
.card:hover .art{filter:saturate(1.2) contrast(1.05)}
.card:hover .who b{text-decoration:underline;text-underline-offset:4px}
.card .body{padding:14px 0 0;display:grid;gap:8px}
.who{display:flex;gap:12px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);color:#fff;font-size:.9rem}
.who b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.15rem;line-height:1.2}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.meta span{display:inline-flex;gap:4px;align-items:center}
.cardfoot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--hair);padding-top:9px;font-size:.84rem}
.next{color:var(--accent);font-family:var(--f-mono);font-size:.78rem}
.star{color:var(--ink)}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* «фото» работ */
.art{position:relative;overflow:hidden;min-height:0}
.art span{position:absolute;left:8px;bottom:6px;font-family:var(--f-mono);font-size:.64rem;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px}

/* профиль */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--paper);width:min(780px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--ink);padding:0 0 env(safe-area-inset-bottom,0px)}
.dhead{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--ink)}
.dhead .dtitle{font-size:.9rem;font-weight:600;color:var(--muted)}
.dhead .back{color:var(--ink);font-size:.95rem}
.dhead .btn{white-space:nowrap}
.dbody{padding:24px;display:grid;gap:30px}
.phead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.phead .ava{width:72px;height:72px;font-size:1.5rem}
.phead > div{flex:1;min-width:0}
.phead h2{font-size:1.8rem;text-transform:none;letter-spacing:0}
.phead .meta > span{display:inline}
.selbox{padding:16px 0 0;display:grid;gap:8px;font-size:.88rem;border-top:1px solid var(--ok)}
.selbox b{color:var(--ok);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}
.selbox ul{margin:0;padding-left:18px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.gallery .art{aspect-ratio:4/5;max-width:100%}
.dbody section > h3{padding-bottom:10px;border-bottom:1px solid var(--ink);margin-bottom:12px !important}
.svc{display:grid}
.svc label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.svc label.on{color:var(--accent)}
.svc input{accent-color:var(--accent)}
.days{display:flex;gap:0;overflow-x:auto;border:1px solid var(--ink)}
.day{flex:1 0 64px;border:0;border-right:1px solid var(--hair);background:none;padding:8px 6px;text-align:center}
.day:last-child{border-right:0}
.day b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.2}
.day small{font-size:.66rem;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:.06em}
.day.on{background:var(--ink);color:var(--paper)}
.day.on small{color:var(--paper);opacity:.7}
.day:disabled{opacity:.3;cursor:default}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.slot{border:1px solid var(--hair);background:none;padding:9px 0;font-family:var(--f-mono);font-size:.88rem}
.slot:hover{border-color:var(--ink)}
.slot.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* талон записи */
.bookbar{position:sticky;bottom:0;background:var(--tint);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px dashed var(--ink);
  -webkit-mask:radial-gradient(circle 8px at 0 0,transparent 98%,#000) top left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 0,transparent 98%,#000) top right/51% 100% no-repeat;
  mask:radial-gradient(circle 8px at 0 0,transparent 98%,#000) top left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 0,transparent 98%,#000) top right/51% 100% no-repeat}
.review{padding:14px 0;border-top:1px solid var(--hair);display:grid;gap:4px}
.review:first-of-type{border-top:0}
.rhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem}
.rhead .muted{font-family:var(--f-mono);font-size:.75rem}
.review p{margin:0;max-width:65ch}
.map{height:120px;border:1px solid var(--ink);position:relative;overflow:hidden;
  background:linear-gradient(90deg,var(--hair) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(0deg,var(--hair) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(28deg,transparent 46%,var(--muted) 46% 47.5%,transparent 47.5%),var(--paper)}
.map::after{content:"";position:absolute;left:56%;top:34%;width:14px;height:14px;background:var(--accent);box-shadow:0 0 0 6px var(--accent-tint)}
.map span{position:absolute;left:0;bottom:0;background:var(--ink);color:var(--paper);padding:4px 10px;font-size:.78rem}

/* списки */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px;align-items:start}
.stack{display:grid;gap:14px}
.bk{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 0}
.date{text-align:left;border-right:1px solid var(--hair);padding-right:12px}
.date b{display:block;font-family:var(--f-display);font-weight:400;font-size:2.1rem;line-height:1}
.date small{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.sect{font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.note{padding:16px 0;font-size:.88rem;display:grid;gap:8px}
.note > b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:1.5rem;padding:0 2px;color:var(--hair)}
.stars button.on{color:var(--accent)}

/* чат */
.chat{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:480px;overflow:hidden;border:1px solid var(--ink)}
.threads{border-right:1px solid var(--ink);overflow-y:auto}
.thread{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--hair);background:none;padding:12px 14px;text-align:left}
.thread.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--accent)}
.thread .ava{width:34px;height:34px;font-size:.8rem}
.thread div{min-width:0}
.thread small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv{display:flex;flex-direction:column;min-width:0}
.convhead{padding:12px 16px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center;gap:8px}
.msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:420px}
.msg{max-width:75%;padding:9px 13px;background:var(--tint);align-self:flex-start;font-size:.92rem}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper)}
.msg time{display:block;font-size:.66rem;opacity:.6;font-family:var(--f-mono);margin-top:2px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-family:var(--f-mono);font-size:.7rem;text-align:center}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--hair)}
.compose input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--ink);padding:8px 2px;background:transparent}

/* кабинет мастера */
.mtabs{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:22px;border-bottom:1px solid var(--hair)}
.mtabs .chip{padding-bottom:8px;margin-bottom:-1px;border-bottom-width:2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:26px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.kpi{padding:16px 16px 14px 0;border-top:0}
.kpi + .kpi{border-left:1px solid var(--hair);padding-left:16px}
.kpi b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.9rem;line-height:1.1}
.kpi small{color:var(--muted);font-size:.78rem}
.sched{overflow-x:auto}
.sched table{border-collapse:collapse;min-width:660px;width:100%}
.sched th{font-size:.66rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:6px 2px;border-bottom:1px solid var(--ink)}
.sched td{padding:2px;border-bottom:1px solid var(--hair)}
.sched td:first-child{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);text-align:right;padding-right:10px;width:56px}
.cell{width:100%;height:32px;border:0;background:none;font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cell:hover:not(:disabled){background:var(--tint)}
.cell.free{background:var(--accent-tint);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.booked{background:var(--ink);color:var(--paper);cursor:default}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin:12px 0}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:5px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.plan{padding:18px 0;display:grid;gap:12px;align-content:start}
.plan.cur{border-top:3px solid var(--accent)}
.plan h3{font-size:.75rem}
.plan ul{margin:0;padding-left:18px;font-size:.88rem}
.price{font-family:var(--f-display);font-size:2rem;line-height:1}
.svcedit{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px auto;gap:12px;align-items:center}
.svcedit input{border:0;border-bottom:1px solid var(--hair);padding:8px 0;background:transparent;min-width:0}
.svcedit input:focus{border-bottom-color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:13px 20px;font-size:.88rem;max-width:calc(100% - 32px);border-left:4px solid var(--accent)}
.demo{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-align:center;padding:32px 16px 0}

@media (max-width:900px){
  .intro,.cols{grid-template-columns:1fr;gap:24px}
  .nav{order:3;flex-basis:100%;gap:18px}
  .top .wrap{justify-content:space-between}
  .frow{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0;padding-left:0;border-top:1px solid var(--hair)}
  .kpi:nth-child(4){border-top:1px solid var(--hair)}
  .plans{grid-template-columns:1fr}
}
/* нижний таб-бар — как в мобильном приложении */
.tabbar{display:none}
.hint{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-tint);padding:12px 16px;margin-bottom:20px;font-size:.9rem}
.hint b{color:var(--accent)}
.ftoggle{display:none}
.dfoot{position:sticky;bottom:0;z-index:2;margin-top:8px}
.bookbar .sum{min-width:0}
.bookbar .sum b{display:block}
.msched{display:none}
.mlist{display:grid;border-top:1px solid var(--ink)}
.mrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--hair)}
.mrow .mono{color:var(--muted);font-size:.8rem}
.mrow .cell{height:auto;min-height:38px;text-align:left;padding:8px 12px;line-height:1.3}
.mrow .cell.booked{text-transform:none;letter-spacing:0;font-size:.82rem;font-weight:500}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbox code{font-family:var(--f-mono);font-size:.85rem;padding:7px 10px;background:var(--tint);user-select:all;min-width:0;overflow-wrap:anywhere}

@media (max-width:640px){
  .wrap{padding-inline:16px}
  .nav{display:none}
  .logo small{display:none}
  .top .wrap{min-height:52px;flex-wrap:nowrap}
  .role{margin-left:auto}

/* облегчённый интерфейс: тонкие линии, обычный регистр, спокойные кнопки */
.top{border-bottom:1px solid var(--hair)}
h1,h2{text-transform:none;letter-spacing:0}

.role{border:0;background:var(--tint);padding:3px;gap:2px}

.role button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.themebtn{text-transform:none;letter-spacing:0;font-weight:500;font-size:.82rem;border-color:var(--hair)}

.btn:hover{background:var(--tint);color:var(--ink)}
.btn.sm{font-size:.85rem;padding:6px 12px}
.btn.ghost{text-decoration:none;padding-inline:0}
.tag{text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:500}

.field{text-transform:none;letter-spacing:0;font-size:.82rem;font-weight:500}
.field input,.field select,.field textarea,.compose input{border-bottom-color:var(--hair)}
.panel,.intro,.selbox,.mlist{border-top-color:var(--hair)}
.intro{border-bottom-color:var(--hair)}

.drawer{border-left-color:var(--hair)}
.days,.chat,.map{border-color:var(--hair)}
.threads{border-color:var(--hair)}
.day small,.date small,.cell,.sched th{text-transform:none;letter-spacing:0}

.selbox b{text-transform:none;letter-spacing:0;font-size:.9rem}
.sect{text-transform:none;letter-spacing:0;font-size:.9rem;font-weight:500}

.sched th{border-bottom-color:var(--hair)}
.bookbar{-webkit-mask:none;mask:none;border-top:1px solid var(--hair);background:var(--paper)}
.hint{padding:10px 14px;font-size:.88rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* строка поиска: заметная, с лупой */
.search{position:relative;display:block}
.search .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--accent);pointer-events:none}
.search input{width:100%;box-sizing:border-box;border:1.5px solid var(--accent);border-radius:14px;background:var(--paper);padding:15px 16px 15px 48px;font:inherit;font-size:16px;color:var(--ink);box-shadow:0 0 0 4px var(--accent-tint)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;box-shadow:0 0 0 4px var(--accent-tint),0 0 0 1px var(--accent)}

/* запись в профиле свёрнута, сначала работы */
.acc{border:1px solid var(--hair);border-radius:16px;padding:0;overflow:hidden;scroll-margin-top:12px}
.acc.open{padding:0 16px 16px}
.acc.open .acchead{margin:0 -16px 4px;width:calc(100% + 32px)}
.acchead{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;cursor:pointer}
.acchead > span:first-child{display:grid;gap:2px}
.acchead .chev{color:var(--accent);font-weight:600;font-size:.9rem;white-space:nowrap}
.acchead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:16px}

/* фильтр цены: два ползунка */
.pf{grid-column:1/-1;display:grid;gap:8px;max-width:520px}
.pfh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.82rem;font-weight:500;color:var(--muted)}
.pfh b{color:var(--ink);font-size:.98rem;font-weight:600}
.range{position:relative;height:28px}
.range::before,.range::after{content:"";position:absolute;top:50%;height:4px;margin-top:-2px;border-radius:2px}
.range::before{left:0;right:0;background:var(--hair)}
.range::after{left:var(--a);right:calc(100% - var(--b));background:var(--accent)}
.range input{position:absolute;inset:0;width:100%;margin:0;background:none;-webkit-appearance:none;appearance:none;pointer-events:none;z-index:1}
.range input::-webkit-slider-runnable-track{background:none;border:0;height:28px}
.range input::-moz-range-track{background:none;border:0}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:24px;height:24px;margin-top:2px;border-radius:50%;background:var(--paper);border:2px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:grab}
.range input::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--accent);cursor:grab}
.range input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--accent-tint)}
.pends{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}

/* ===== Камертон: айдентика ===== */
body{font-family:var(--f-body);font-size:16px}
h1,h2,h3,.who b,.day b,.date b,.kpi b,.price,.note > b,.phead h2{font-weight:600;letter-spacing:-.01em}
.intro h1{letter-spacing:-.02em}
.mono{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.logo{font-family:var(--f-body);font-weight:500;font-size:1rem;letter-spacing:.16em;align-items:center;color:var(--ink)}
.logo .mark{width:24px;height:24px;color:var(--accent);flex:none}
.logo small{letter-spacing:0;font-weight:400}
.btn{border-radius:12px}
.btn.primary{text-transform:uppercase;letter-spacing:.12em;font-weight:500;font-size:.85rem}
.btn.sm.primary{font-size:.75rem}
.btn.wide{width:100%;padding:14px 16px}
.role,.role button,.themebtn,.hint,.search input,.slot,.days,.day,.map,.acc,.toast{border-radius:12px}
.day{border-radius:0}.days{overflow:hidden}
.chip.on{border-bottom-color:var(--accent);color:var(--ink)}
.ava{font-family:var(--f-body);font-weight:500}
/* знак камертона */
.mark{display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* карточка мастера */
.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--surface);border-radius:20px;padding:18px;gap:12px;cursor:pointer;justify-content:flex-start}
.card .who{align-items:center}
.card .ava{width:56px;height:56px;font-size:1.05rem}
.cname{all:unset;cursor:pointer;font-weight:600;font-size:1.1rem;line-height:1.25}
.cname:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.card:hover .cname{text-decoration:underline;text-underline-offset:4px}
.appr{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.95rem;line-height:1.45}
.ptags{display:flex;flex-wrap:wrap;gap:6px}
.ptag{background:var(--tint);border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--ink)}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.match{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.match .mark{width:22px;height:22px}
.match small{font-weight:500;color:var(--muted)}
.ver{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 8px;vertical-align:2px;margin-left:6px;white-space:nowrap}
.why{display:grid;gap:6px;background:var(--surface);border-radius:20px;padding:16px 18px}
.why ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.why li{background:var(--tint);border-radius:999px;padding:5px 12px;font-size:.85rem}
.why li::after{content:" ✓";color:var(--ok)}
.lowmore{text-align:center;padding:16px 0}
/* настройка */
.tune{max-width:560px;margin:0 auto;display:grid;gap:20px;padding-block:8px 24px}
.tprog{height:3px;background:var(--hair);border-radius:2px;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.tstep{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.tune h1{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.15}
.topts{display:grid;gap:10px}
.topt{border:1px solid var(--hair);background:var(--paper);border-radius:14px;padding:16px 18px;text-align:left;font-size:1rem;color:var(--ink)}
.topt:hover{border-color:var(--accent);background:var(--tint)}
.topt.on{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 0 0 1px var(--accent)}
.tune .lead{color:var(--muted);margin:0}
.tdone{background:var(--surface);border-radius:20px;padding:28px 22px;display:grid;gap:14px;text-align:center;justify-items:center}
.tdone .mark{width:44px;height:44px;color:var(--accent)}
.tdone h1{margin:0}
@media (max-width:640px){
  .card{padding:16px}
  .grid{gap:14px}
}
/* ===== Камертон v2: по PDF «логотип и шрифты» ===== */
body{font-family:var(--f-body);font-size:16px;line-height:1.6;color:var(--ink)}
h1,h2,.phead h2,.kpi b,.price,.day b,.date b,.note > b,.tdone h1,.tune h1{font-family:var(--f-display);font-weight:400;letter-spacing:0;line-height:1.2}
h3,.dbody section > h3{font-family:var(--f-body);font-weight:600}
.who b,.cname{font-family:var(--f-body);font-weight:600}
.logo{gap:10px;color:var(--accent)}
.logo .mark{width:22px;height:22px;stroke-width:1.8}
.wordmark{font-family:var(--f-display);font-weight:400;font-size:1.25rem;letter-spacing:.14em;color:var(--accent);line-height:1}
.logo small{font-family:var(--f-body);color:var(--muted);letter-spacing:.04em}
.mark{stroke-width:1.8}
/* прямые углы, круглые только пилюли и аватары */
.btn,.card,.why,.tdone,.topt,.acc,.acchead:focus-visible,.search input,.role,.role button,.themebtn,.hint,.slot,.days,.map,.toast,.cell,.msg,.compose input,.linkbox code{border-radius:var(--r)}
.ptag,.why li,.ver{border-radius:999px}
.btn{font-family:var(--f-body);font-weight:500}
.btn.primary{font-weight:600;letter-spacing:.16em;font-size:.8rem;padding-block:13px}
.btn.primary:hover{filter:none;background:var(--espresso);border-color:var(--espresso)}
:root[data-ritm="dark"] .btn.primary:hover{background:#F0CDB6;border-color:#F0CDB6}
.btn:not(.primary):not(.ghost){border-color:var(--hair);color:var(--ink)}
.btn:not(.primary):not(.ghost):hover{border-color:var(--ink);background:none}
/* главный экран */
.intro{position:relative;align-items:center;padding-block:12px 32px}
.intro h1{font-size:clamp(2.2rem,5.6vw,4rem);line-height:1.1;color:var(--accent)}
.intro .sub{font-family:var(--f-display);font-size:clamp(1.15rem,2.2vw,1.6rem);line-height:1.25;margin:10px 0 0;color:var(--ink)}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.howcol{display:grid;gap:18px;justify-items:start}
.reso{width:150px;height:auto;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.reso .arc{stroke:var(--arc);stroke-width:1.4}
.reso g path{stroke-width:.9}
.how li{border-top-color:var(--hair)}
.how li::before{font-family:var(--f-display);font-size:.95rem;color:var(--accent)}
/* поиск и фильтры */
.search input{border:1px solid var(--accent);box-shadow:none;background:var(--paper)}
.search input:focus{box-shadow:0 0 0 3px var(--accent-tint)}
.chip{font-size:.92rem}
.chip.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.range input::-webkit-slider-thumb{box-shadow:0 1px 4px rgba(59,42,34,.18)}
.role button.on{box-shadow:0 1px 3px rgba(59,42,34,.14)}
/* карточка мастера — как в PDF */
.grid{gap:20px}
.card{background:var(--surface);padding:22px;gap:14px;border:0}
.card .muted,.card .small.muted,.why,.tdone .lead,.card .match small{color:var(--ink)}
.ava{background:var(--ava-bg);color:var(--ava-ink);font-family:var(--f-body);font-weight:600}
.card .ava{width:56px;height:56px}
.cname{font-size:1.08rem;color:var(--ink)}
.appr{font-size:.95rem;color:var(--ink)}
.ptag{background:var(--tint);color:var(--ink);font-size:.8rem;padding:5px 13px}
:root[data-ritm="dark"] .ptag{background:var(--tint)}
.match{color:var(--accent);font-weight:600;font-size:.92rem}
.match .mark{width:20px;height:20px}
.cfoot{border-top:0;padding-top:0}
.ver{color:var(--accent);background:var(--tint);font-weight:600;letter-spacing:.02em;font-family:var(--f-body);font-size:.72rem}
.why{background:var(--surface)}

.why li::after{color:var(--accent)}

.tprog{height:2px}
.topt{border-color:var(--hair);background:var(--paper)}

.tdone{background:var(--surface);padding:36px 24px}

:root[data-ritm="dark"] .toast{background:#FBF3EF;color:#3B2A22;border-left-color:#6E4B38}
.hint{background:var(--tint)}
.msg.me{background:var(--accent);color:var(--accent-ink)}
.top{background:var(--paper)}
.tabbar button.on{color:var(--accent)}
.kpi b{color:var(--accent)}
@media (max-width:900px){.howcol{display:none}}
@media (max-width:640px){

function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000}}

/* слоты: free | closed | booked */
function daySlots(mid,day){
  const k=mid+"|"+day;
  if(!S.slots[k]){const r=rng(k);const d=dayDate(day);const off=d.getDay()===(mid.length%7);const o={};
    HOURS.forEach(h=>o[h]=(!off&&r()>.42)?"free":"closed");
    if(day===0){const now=new Date().getHours();HOURS.forEach(h=>{if(h<=now)o[h]="closed"})}
    S.slots[k]=o}
  const o=S.slots[k];
  S.bookings.forEach(b=>{if(b.mid===mid&&b.day===day&&b.status==="upcoming")o[b.hour]="booked"});
  return o;
}
function nearest(mid){for(let d=0;d<7;d++){const o=daySlots(mid,d);const h=HOURS.find(h=>o[h]==="free");if(h!=null)return{d,h}}return null}
const MARK=`<svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2.5V11.5C8 14.6 10 16.4 12 17.6C14 16.4 16 14.6 16 11.5V2.5"/><path d="M12 17.6V22"/></svg>`;
const VER=`<span class="ver" title="Профиль прошёл модерацию">✓ Проверенный мастер</span>`;
const pillsOf=m=>[...m.pills,...(m.age?[ageLabel(m.age)]:[])];
function rating(mid){const r=S.reviews[mid];return r.length?(r.reduce((a,x)=>a+x.stars,0)/r.length):0}
const ALLP=()=>MASTERS.flatMap(m=>m.svc.map(x=>x[1]).filter(x=>x>0));
// шкала цены неравномерная: внизу шаг 500 ₽, вверху крупнее, чтобы дорогие услуги не сжимали дешёвые
const PSTOPS=[0,500,1000,1500,2000,2500,3000,3500,4000,4500,5000,6000,7000,8000,9000,10000,12000,15000,18000,20000,25000,30000,35000,40000,45000,50000,55000,60000,67000];
const PLO=()=>PSTOPS[0],PHI=()=>PSTOPS[PSTOPS.length-1];
const pIdx=v=>{let b=0;PSTOPS.forEach((x,i)=>{if(Math.abs(x-v)<Math.abs(PSTOPS[b]-v))b=i});return b};
const pPc=v=>(pIdx(v)/(PSTOPS.length-1)*100).toFixed(1);
function pRange(f){const lo=PLO(),hi=PHI();let a=f.pmin==null?lo:Math.max(lo,Math.min(hi,+f.pmin)),b=f.pmax==null?hi:Math.max(lo,Math.min(hi,+f.pmax));if(a>b)[a,b]=[b,a];return{lo,hi,a,b,on:a>lo||b<hi}}
const pr=v=>String(v).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" ₽";
function pLabel(r){return !r.on?"любая":r.b>=r.hi?`от ${pr(r.a)}`:r.a<=r.lo?`до ${pr(r.b)}`:`${pr(r.a)} – ${pr(r.b)}`}
function nearestLabel(n){if(!n)return"нет окон на неделю";return (n.d===0?"сегодня":n.d===1?"завтра":fmtDay(n.d))+" в "+n.h+":00"}

}

/* ---------- события ---------- */
const REPLIES=["Здравствуйте! Да, конечно.","Спасибо, что написали. Жду вас!","Можно, возьмите с собой фото примера, если есть.","Хорошо, учту при записи."];
/* «Назад»: и кнопка на экране, и системная кнопка телефона закрывают профиль или переписку */
function layer(){return S.open?"profile":S.chatView?"chat":null}
function stepBack(){if(S.open){S.open=null;S.resched=null}else if(S.chatView){S.chatView=false}render()}
window.addEventListener("popstate",()=>{if(layer())stepBack()});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==="close-bg"&&e.target!==t)return;
  if(["close","close-bg","chat-back"].includes(a)){let h=null;try{h=history.state}catch(err){}
    if(h&&h.ritm){history.back();return}stepBack();return}
  const before=layer();
  switch(a){
    case"role":S.role=v;S.open=null;if(v==="client"&&e.target.closest(".resinfo")){S.open="anna";const n=nearest("anna");S.pDay=n?n.d:0;S.pSlot=n?n.h:null}break;
    case"tab":S.tab=v;S.open=null;S.chatView=false;break;
    case"cat":S.f.cat=v;break;
    case"clearf":S.f={cat:"all",metro:"all",place:"all",priv:false,q:"",sort:S.f.sort,pmin:null,pmax:null,pills:[]};break;
    case"open":{S.open=v;S.allRev=false;S.bookOpen=false;S.pSvc=0;S.confirming=false;const n=nearest(v);S.pDay=n?n.d:0;S.pSlot=n?n.h:null;break}
    case"close":case"close-bg":S.open=null;S.resched=null;break;
    case"svc":S.pSvc=+v;S.confirming=false;break;
    case"pday":{S.pDay=+v;const o=daySlots(S.open,S.pDay);const h=HOURS.find(x=>o[x]==="free");S.pSlot=h??null;S.confirming=false;break}
    case"slot":S.pSlot=+v;S.confirming=false;break;
    case"confirm":S.confirming=true;break;
    case"unconfirm":S.confirming=false;break;
    case"book":{const m=M(S.open);S.bookings.push({id:S.nextId++,mid:m.id,svc:S.pSvc,day:S.pDay,hour:S.pSlot,client:"me",status:"upcoming"});
      if(S.resched){const ob=S.bookings.find(x=>x.id===S.resched);if(ob&&ob.status==="upcoming"){ob.status="cancelled";const o=S.slots[ob.mid+"|"+ob.day];if(o)o[ob.hour]="free"}S.resched=null;
        toast(`Запись перенесена: ${fmtDay(S.pDay)}, ${S.pSlot}:00. Старое окно освободилось.`)}
      else toast(`Вы записаны: ${m.name}, ${fmtDay(S.pDay)}, ${S.pSlot}:00. Напомним за сутки.`);
      S.open=null;S.tab="bookings";S.pSlot=null;S.confirming=false;break}
    case"come":{const b=S.bookings.find(x=>x.id===+v);b.came=true;toast("Спасибо! Мастер видит, что вы придёте");break}
    case"resched":{const b=S.bookings.find(x=>x.id===+v);S.resched=b.id;S.bookOpen=true;S.open=b.mid;S.pSvc=b.svc;S.pSlot=null;S.confirming=false;const n=nearest(b.mid);S.pDay=n?n.d:0;S.pSlot=n?n.h:null;break}
    case"sday":S.sDay=+v;break;
    case"ftoggle":S.showF=!S.showF;break;
    case"hint-ok":S.hintSeen=true;break;
    case"fpill":{const p=S.f.pills,k=p.indexOf(v);if(k<0)p.push(v);else p.splice(k,1);break}
    case"fpill-clear":S.f.pills=[];break;
    case"mpill":{const p=M("anna").pills,k=p.indexOf(v);if(k<0)p.push(v);else p.splice(k,1);saveAnna();break}
    case"rmiss":{const p=S.rMiss=S.rMiss||[],k=p.indexOf(v);if(k<0)p.push(v);else p.splice(k,1);t.classList.toggle("on",k<0);t.setAttribute("aria-pressed",k<0);return}
    case"openbook":{S.open=v;S.allRev=false;S.bookOpen=true;scrollBook=true;S.pSvc=0;S.confirming=false;const n=nearest(v);S.pDay=n?n.d:0;S.pSlot=n?n.h:null;break}
    case"allrev":S.allRev=true;break;
    case"booktoggle":S.bookOpen=!S.bookOpen;if(S.bookOpen)scrollBook=true;break;
    case"bookopen":S.bookOpen=true;scrollBook=true;break;
    case"copylink":{const txt=t.dataset.v;try{navigator.clipboard.writeText(txt).then(()=>toast("Ссылка скопирована"),()=>toast("Выделите ссылку и скопируйте вручную"))}catch(err){toast("Выделите ссылку и скопируйте вручную")}return}
    case"cancel":S.cancelId=+v;break;
    case"cancel-no":S.cancelId=null;break;
    case"cancel-yes":{const b=S.bookings.find(x=>x.id===+v);b.status="cancelled";const o=S.slots[b.mid+"|"+b.day];if(o)o[b.hour]="free";S.cancelId=null;toast("Запись отменена, окно снова доступно другим клиентам");break}
    case"review":S.reviewFor=+v;S.rStars=5;S.rMiss=[];break;
    case"review-x":S.reviewFor=null;break;
    case"stars":S.rStars=+v;document.querySelectorAll(".stars button").forEach((b,i)=>b.classList.toggle("on",i<S.rStars));return;
    case"remind":{const b=myUpcoming().sort((a,b)=>a.day*100+a.hour-(b.day*100+b.hour))[0];if(b)toast(`Камертон · ${b.day===0?"Сегодня":b.day===1?"Завтра":fmtDay(b.day)} в ${b.hour}:00 — ${M(b.mid).svc[b.svc][0]} у ${M(b.mid).name}. Приду / Перенести`);return}
    case"chat-open":S.role="client";S.tab="chats";S.chatWith=v;S.chatView=true;S.open=null;if(!S.chats[v])S.chats[v]=[];break;
    case"cchat-pick":S.chatWith=v;S.chatView=true;break;
    case"chat-back":S.chatView=false;break;
    case"mchat-pick":S.mtab="chats";S.mChatWith=v;S.chatView=true;break;
    case"mtab":S.mtab=v;S.chatView=false;break;
    case"cell":{const d=+t.dataset.d,h=+t.dataset.h,o=daySlots("anna",d);o[h]=o[h]==="free"?"closed":"free";break}
    case"openall":for(let d=0;d<7;d++){const dd=dayDate(d).getDay();if(dd===0||dd===6)continue;const o=daySlots("anna",d);for(let h=11;h<=19;h++)if(o[h]==="closed"&&!(d===0&&h<=new Date().getHours()))o[h]="free"}toast("Окна открыты на будни с 11 до 19");break;
    case"closeall":for(let d=0;d<7;d++){const o=daySlots("anna",d);HOURS.forEach(h=>{if(o[h]==="free")o[h]="closed"})}break;
    case"svc-add":M("anna").svc.push(["Новая услуга",1000,60]);break;
    case"svc-del":if(M("anna").svc.length>1)M("anna").svc.splice(+v,1);break;
    case"upload":toast("В демо загрузка фото отключена: работы проходят модерацию перед публикацией");return;
    case"plan":S.plan=v;M("anna").promo=v==="boost";toast(v==="boost"?"Продвижение включено: профиль выше в выдаче, с меткой «Продвигается»":"Продвижение отключено");break;
    case"theme":setTheme(curTheme()==="dark"?"light":"dark");return;
    case"reset":try{localStorage.removeItem("ritm-v2")}catch(e){}S=freshState();syncAnna();toast("Демо сброшено");break;
  }
  render();
  const after=layer();if(after&&after!==before){try{history.pushState({ritm:after},"")}catch(err){}}
  if(!after&&before){try{if(history.state&&history.state.ritm)history.replaceState(null,"")}catch(err){}}
  if(["tab","mtab","role","book","chat-open","cancel-yes","cchat-pick","mchat-pick"].includes(a))window.scrollTo(0,0);
  if(a==="open"||a==="resched"){const dr=document.querySelector(".drawer");if(dr)dr.scrollTop=0}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.price){const k=el.dataset.price,o=k==="pmin"?"pmax":"pmin",other=document.querySelector(`[data-price="${o}"]`);let v=+el.value;
    if(k==="pmin"&&v>+other.value)v=+other.value;if(k==="pmax"&&v<+other.value)v=+other.value;el.value=v;S.f[k]=PSTOPS[v];
    const r=pRange(S.f),pc=pPc,box=document.getElementById("prange");
    box.style.setProperty("--a",pc(r.a)+"%");box.style.setProperty("--b",pc(r.b)+"%");document.getElementById("pval").textContent=pLabel(r);return}
  if(el.dataset.in){const k=el.dataset.in;S.f[k]=el.type==="checkbox"?el.checked:el.value;
    if(k==="q"){const pos=el.selectionStart;render();const q=document.getElementById("q");q.focus();q.setSelectionRange(pos,pos)}else render();return}
  if(el.dataset.svc){const s=M("anna").svc[+el.dataset.svc],k=+el.dataset.k;s[k]=k===0?el.value:Math.max(0,+el.value||0);saveAnna();return}
  if(el.dataset.mage){M("anna").age=+el.value;saveAnna();return}
  if(el.dataset.mp){M("anna")[el.dataset.mp]=el.value;saveAnna();if(el.tagName==="SELECT")render()}
});
document.addEventListener("change",e=>{if(e.target.dataset.price){render();const el=document.querySelector(`[data-price="${e.target.dataset.price}"]`);if(el)el.focus()}});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,kind=f.dataset.form;
  if(kind==="review"){const b=S.bookings.find(x=>x.id===+f.dataset.v),txt=document.getElementById("rtext").value.trim();if(!txt)return;
    S.reviews[b.mid].unshift({author:"Вы",stars:S.rStars,text:txt,svc:M(b.mid).svc[b.svc][0],ago:0,miss:S.rMiss||[]});b.reviewed=true;S.reviewFor=null;S.rMiss=[];toast("Спасибо! Отзыв опубликован с отметкой «визит подтверждён»");render();return}
  const inp=f.querySelector("input"),txt=inp.value.trim();if(!txt)return;
  if(kind==="cchat"){const id=S.chatWith||Object.keys(S.chats)[0];S.chatWith=id;(S.chats[id]=S.chats[id]||[]).push({from:"me",text:txt,t:nowTime()});render();
    setTimeout(()=>{S.chats[id].push({from:"m",text:REPLIES[Math.floor(Math.random()*REPLIES.length)],t:nowTime()});render()},1200)}
  if(kind==="mchat"){const id=S.mChatWith;if(id==="me")(S.chats.anna=S.chats.anna||[]).push({from:"m",text:txt,t:nowTime()});else S.mChats[id].push({from:"m",text:txt,t:nowTime()});render()}
  const ni=document.getElementById(kind+"-input");if(ni)ni.focus();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&layer()){let h=null;try{h=history.state}catch(err){}if(h&&h.ritm)history.back();else stepBack()}});

/* правки мастера Анны сохраняются отдельно поверх исходных данных */
function saveAnna(){const a=M("anna");S.anna={svc:a.svc,place:a.place,addr:a.addr,about:a.about,appr:a.appr,promo:a.promo,pills:a.pills,age:a.age};save()}
const ANNA0=JSON.parse(JSON.stringify(M("anna")));
function syncAnna(){const a=M("anna");Object.assign(a,JSON.parse(JSON.stringify(ANNA0)),S.anna||{});a.promo=S.plan==="boost"}
const _render=render;render=function(){if(S.role==="master"||S.anna)saveAnna();_render()};
/* тема: светлая / тёмная, по умолчанию — как в системе */
function curTheme(){return document.documentElement.dataset.ritm==="dark"?"dark":"light"}
function setTheme(t,silent){document.documentElement.dataset.ritm=t;document.documentElement.style.colorScheme=t;try{localStorage.setItem("ritm-theme-v2",t)}catch(e){}
  const b=document.getElementById("themebtn");b.innerHTML=`<i></i>${t==="dark"?"Светлая тема":"Тёмная тема"}`;if(!silent)toast(t==="dark"?"Включена тёмная тема":"Включена светлая тема")}
let savedTheme=null;try{savedTheme=localStorage.getItem("ritm-theme-v2")}catch(e){}
setTheme("light",true); // тёмной темы нет (бренд-гайд v3, раздел 7)
syncAnna();render();
</script>
